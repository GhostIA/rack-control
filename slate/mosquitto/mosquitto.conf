# rack-control broker -- Mosquitto 2.x on the GL.iNet Slate 7 (OpenWrt).
# Deployed to /etc/mosquitto/mosquitto.conf. See slate/README.md.
#
# Security model: mutual TLS (client cert signed by the rack-control CA)
# AND a per-user password AND a least-privilege ACL. All three must pass.
# There is NO plaintext listener. Never port-forward 8883 on the WAN.

# One global security config shared by every listener (there is only one).
# With "false", password_file / acl_file / allow_anonymous below apply
# broker-wide instead of having to be repeated per listener.
per_listener_settings false

# SECURITY: no anonymous clients. Every connection must present a username
# and password that are in password_file.
allow_anonymous false

# SECURITY: Mosquitto 2.x $7$ (PBKDF2-SHA512) hashes, generated by
# `rackpki passwd` from the 1Password environment. Mode 0600, owner mosquitto.
password_file /etc/mosquitto/passwd

# SECURITY: per-user topic permissions; anything not listed is denied.
acl_file /etc/mosquitto/acl

# A client may not connect with an empty client ID.
allow_zero_length_clientid false

# State lives in retained messages that clients republish when they connect,
# and commands are never retained, so nothing goes to flash.
persistence false

# OpenWrt: log to syslog (`logread -e mosquitto`), not to a file on flash.
log_dest syslog
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp false

# ---------------------------------------------------------------------------
# The ONLY listener: MQTT over TLS on the LAN address only.
# SECURITY: bound to 192.168.8.1 (br-lan), so it is never reachable on the WAN
# interface. There is deliberately no plaintext (non-TLS) listener.
listener 8883 192.168.8.1

# SECURITY: listener-scoped options MUST come after the `listener` line.
# Placed above it, Mosquitto applies them to an implicit default listener and
# opens the plaintext default MQTT port on ALL interfaces (seen on the Slate,
# 2.0.18).
# TestListenerScopedAfterListener enforces this.

# SECURITY: the broker sets each client ID to the authenticated username.
# Otherwise a compromised client could connect with client ID "orchestrator"
# or "sbc4" and keep kicking the real session off (a takeover DoS). Clients
# already use client ID = username, so nothing changes for them.
use_username_as_clientid true

# SECURITY: CA that signs every client cert. Only certs it issued are accepted.
cafile /etc/mosquitto/certs/ca.crt
# Broker cert: IP SAN 192.168.8.1 only. Clients verify it (ServerName 192.168.8.1).
certfile /etc/mosquitto/certs/broker.crt
# SECURITY: broker private key, mode 0600, owner mosquitto.
keyfile /etc/mosquitto/certs/broker.key

# SECURITY: mutual TLS. A client without a valid CA-signed cert fails the
# TLS handshake before it can send CONNECT.
require_certificate true

# SECURITY: the cert does NOT become the username. The username comes from
# CONNECT and must also pass password_file (cert AND password). Every cert's CN
# is the same as its username anyway, by convention.
use_identity_as_username false

# SECURITY: minimum TLS 1.2. Mosquitto turns off SSLv3/TLS1.0/TLS1.1, and TLS 1.3
# still works.
tls_version tlsv1.2
