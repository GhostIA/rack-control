# rackctl configuration. Install as /etc/rack/rack.toml (root:root 0600).
#
# Relay mapping VERIFIED on 2026-11-21 (map-verify for 0-3, then a one-at-a-time
# power-up confirmed 4 and 6). Relays 3, 5, 7 power nothing. If you rewire, run
# `rackctl map-verify` again (whole rack off, all relays open) before trusting it.

[broker]
host = "192.168.8.1"          # also the TLS ServerName (broker cert has an IP SAN)
port = 8883
ca = "/etc/rack/tls/ca.crt"
cert = "/etc/rack/tls/orchestrator.crt"
key = "/etc/rack/tls/orchestrator.key"
username = "orchestrator"     # also the MQTT client ID; must match the cert CN
password_file = "/etc/rack/orchestrator.password"

[shutdown]
timeout = "120s"              # per host: shutdown cmd -> sustained ping loss (override per [[pc]])
cut_delay = "30s"             # after ping loss, before the relay opens (disks finish syncing)
pve_quorum = 3                # partial shutdowns must leave at least this many PVE nodes up
# Shutdown order (rack-up uses the reverse). Must list every [[pc]] exactly once.
# intel-1ecbc8 runs the ceph maintenance agent, so it goes last.
order = ["intel-a163f8", "intel-91c45d", "intel-d1babf", "intel-177e78", "intel-1ecbc8"]

# roles: "osd" (Ceph OSD host), "mon" (Ceph monitor), "vm" (runs guests).
# relay: 0-3 = HUB0004 port 3 ch0-3, 4-7 = port 4 ch0-3.

[[pc]]
name = "intel-91c45d"
ip = "192.168.8.196"
relay = 0                     # VERIFIED 2026-11-21
roles = ["osd"]

[[pc]]
name = "intel-d1babf"
ip = "192.168.8.194"
relay = 2                     # VERIFIED 2026-11-21
roles = ["osd"]

[[pc]]
name = "intel-177e78"
ip = "192.168.8.162"
relay = 1                     # VERIFIED 2026-11-21
roles = ["osd", "mon"]

[[pc]]
name = "intel-a163f8"
ip = "192.168.8.123"
relay = 4                     # VERIFIED 2026-11-21
roles = ["mon", "vm"]
timeout = "300s"              # VM 200 (media-stack) needs time for a clean guest shutdown

[[pc]]
name = "intel-1ecbc8"
ip = "192.168.8.234"
relay = 6                     # VERIFIED 2026-11-21
roles = ["osd", "mon"]
