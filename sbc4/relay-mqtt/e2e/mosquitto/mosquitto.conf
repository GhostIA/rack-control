# Test-only broker for the relay-mqtt e2e. Mirrors the production listener
# settings (TLS 1.2+, mTLS + password, ACL), with paths under /certs.
per_listener_settings false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
password_file /certs/passwd
acl_file /mosquitto/config/acl

listener 8883
cafile /certs/ca.crt
certfile /certs/server.crt
keyfile /certs/server.key
require_certificate true
use_identity_as_username false
tls_version tlsv1.2
