[package]
name = "relay-mqtt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "MQTT <-> rack_controller Unix-socket bridge for the SBC4 relays"
license = "MIT"
publish = false

[[bin]]
name = "relay-mqtt"
path = "src/main.rs"

# Test-only stand-in for rack_controller's socket server (unit tests + e2e).
[[bin]]
name = "fake-controller"
path = "src/bin/fake-controller.rs"

# Test-only MQTT client driven by the docker e2e (e2e/).
[[bin]]
name = "e2e-check"
path = "src/bin/e2e-check.rs"

[dependencies]
# Eclipse Paho MQTT (Rust wrapper over the Paho C client). `bundled` builds the
# Paho C library from source and `vendored-ssl` builds OpenSSL from source, both
# linked statically (needs cmake, a C compiler and perl at build time).
paho-mqtt = { version = "=0.14.0", default-features = false, features = ["bundled", "ssl", "vendored-ssl"] }
tokio = { version = "1.40", features = ["rt", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-util = { version = "=0.7.20", features = ["codec"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
backon = { version = "=1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
serde = { version = "1", features = ["derive"] }
anyhow = "=1.0.104"
# Config loading: the TOML file, then RELAY_MQTT_* env overrides.
figment = { version = "=0.10.19", features = ["toml", "env"] }
# Panic hook: writes a crash report to the temp dir (we also log the message).
human-panic = { version = "=2.0.2", default-features = false }
log = "0.4"
# Asynchronous logger behind the `log` facade (writer thread -> stderr).
fast_log = { version = "=1.7.10", default-features = false, features = ["runtime_thread"] }
# RUST_LOG-style directive parsing (the parser env_logger uses).
env_filter = { version = "=2.1.0", default-features = false, features = ["std"] }
# Timestamps for the log lines (fast_log's own date crate).
fastdate = "=0.3.36"

[dev-dependencies]
# Real parallelism for the concurrent-client race test.
tokio = { version = "1.40", features = ["rt-multi-thread"] }
# Embedded MQTT broker (plain TCP on 127.0.0.1) for the Paho adapter test.
rumqttd = { version = "=0.20.0", default-features = false }
toml = "0.8.19"

# human-panic picks its style from its own debug_assertions. Build it like
# release in dev/test too, so tests/panic_hook.rs exercises the release hook.
[profile.dev.package.human-panic]
debug-assertions = false

[profile.release]
lto = true
strip = true
panic = "abort"
