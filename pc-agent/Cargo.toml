[package]
name = "rack-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Per-PC MQTT agent: powers this Proxmox host off on the exact payload `shutdown`"
license = "MIT"
publish = false

[[bin]]
name = "rack-agent"
path = "src/main.rs"

[dependencies]
# Eclipse Paho (MQTT C library + Rust wrapper). `bundled` builds Paho C with
# cmake and `vendored-ssl` builds OpenSSL from source, both linked statically.
# Paho is EPL-2.0 / EDL-1.0 (BSD-3-Clause); OpenSSL 3 is Apache-2.0.
paho-mqtt = { version = "=0.14.0", default-features = false, features = ["bundled", "ssl", "vendored-ssl"] }
tokio = { version = "1.40", features = ["rt", "macros", "time", "signal", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8.19"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
zbus = { version = "4.4.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Embedded MQTT broker for the adapter tests (real Paho client on 127.0.0.1).
rumqttd = { version = "=0.20.0", default-features = false }
tokio = { version = "1.40", features = ["rt", "macros", "time", "test-util", "rt-multi-thread", "net", "io-util"] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
